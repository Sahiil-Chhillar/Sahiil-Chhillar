name: Generate visuals

# Regenerates the two animated pieces that need my contribution history:
# the 3D commit calendar and the snake. The other 3D art in the README is
# geometry, not data, so it lives in scripts/gen_3d_assets.py instead.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visuals
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Build the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # One per colour mode; the README shows whichever matches the theme.
          outputs: |
            assets/snake-light.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit whatever changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Refresh the generated visuals
          file_pattern: assets/snake-*.svg profile-3d-contrib/*.svg
